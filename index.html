<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>handplay</title>
  </head>
  <body>
    <div id="app">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <canvas id="drawlayer"></canvas>
      <div id="ui">
        <button id="modeBtn">mode: face-slice</button>
        <button id="drawBtn">draw: off</button>
        <button id="clearBtn">clear</button>
        <button id="shotBtn">📸 save</button>
        <button id="bonesBtn">bones: on</button>
        <label>size <input id="sizeSlider" type="range" min="0.3" max="2.5" step="0.1" value="1" /></label>
        <button id="hitboxBtn">hitboxes: on</button>
        <button id="gestBtn">gestures: on</button>
        <span id="status">loading…</span>
        <span id="hint">✋ draw · ✊ clear · ✌️ vfx · ☝️ bones/hitboxes · flick fist = throw · 📸 saves</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
